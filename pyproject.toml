[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-aigi"
version = "0.1.0"
description = "Dual-branch (DINOv3 + Xception) contrastive pretraining and few-shot AIGI detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fleet contributors" }]
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]

[project.scripts]
fleet-pretrain = "fleet.train.dual_branch_q128:main"
fleet-fewshot = "fleet.train.fewshot_experiment:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
